[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "dnr-quant-system"
version = "0.1.0"
description = "DNR Quant Platform — advisory/research-only implementation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
